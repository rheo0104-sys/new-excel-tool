name: Build-EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Libs
        run: pip install pandas openpyxl pyinstaller
      - name: Build
        run: pyinstaller --onefile --name "MyExcelTool" main.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ExcelTool-Final
          path: dist/MyExcelTool.exe
